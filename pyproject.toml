[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finexisedu-scrapers"
version = "0.1.0"
description = "Keeps FinexisEdu's university fee data up to date"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed for registry sources with `parser: browser` (JavaScript-built pages).
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["scrapers"]

[tool.pytest.ini_options]
testpaths = ["scrapers/tests"]
