# Which page feeds which fee figure. See scrapers/models.py (Source, Target) and README.md.
#
# Sources with targets are scraped monthly. `manual: true` sources are listed in the
# monthly PR when their data is 11+ months old, so a person can re-check them.
# To automate one: add targets, set manual: false and test with
#   python -m scrapers.run --dry-run --only <university>
#
# Patterns run on whitespace-collapsed page text; the first capture group is the amount.

sources:
  # --- scraped automatically ---
  - university: kyoto
    country: jp
    url: https://www.kyoto-u.ac.jp/en/education-campus/faq/2-2
    parser: html
    targets:
    - pattern: Tuition is JPY ?([\d,]+) per year
    - key: oneOffFees
      pattern: amount to JPY ?([\d,]+)
  - university: utokyo
    country: jp
    url: https://www.u-tokyo.ac.jp/en/prospective-students/tuition_fees.html
    parser: html
    targets:
    - key: oneOffFees
      pattern: admission fee is JPY ?([\d,]+)
  - university: utoronto
    country: ca
    url: https://firstyear.engineering.utoronto.ca/finances/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      pattern: tuition is \$ ?([\d,]+)
    - level: bachelor
      field: engineering
      key: annualCompulsoryFees
      pattern: plus \$ ?([\d,.]+) in incidental fees

