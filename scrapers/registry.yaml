# Which official page feeds which fee figure. See scrapers/models.py (Source, Target) and README.md.
#
# Automated sources are scraped monthly: each target's regex runs on the page text and its
# capture group(s) give the amount (several groups are added up). `manual: true` sources are
# pages a person re-checks; the monthly PR lists their programmes once the data is 11+ months old.
# Test a change with: python -m scrapers.run --dry-run --only <university>

sources:
