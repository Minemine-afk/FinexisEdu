# University of Bern. Fee sheet PDF per fee period (new rates from autumn 2026).
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: unibe
    country: ch
    url: https://sub.unibe.ch/wp-content/uploads/2025/06/budget-studierende.pdf
    parser: pdf
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: unibe
    country: ch
    url: https://www.unibe.ch/unibe/portal/content/e1006/e7408/e20292/e175073/e1766093/Fees_fromfall2026_eng.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: computing
      programme: Bachelor of Science in Computer Science
      tier: international
      pattern: Tuition fees 1 Tuition fee per semester CHF (\d[\d’',]*)\.- 1a\* non-Swiss students pay an additional fee of CHF (\d[\d’',]*)\.- per semester
      multiplier: 2
