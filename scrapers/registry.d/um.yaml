# Universiti Malaya. Study@UM programme pages quote the international fee for the whole
# programme; the multiplier divides by the programme's duration in years.
sources:
  - university: um
    country: my
    url: https://study.um.edu.my/bachelor-of-mechanical-engineering
    parser: html
    targets:
    - level: bachelor
      field: engineering
      pattern: International RM ([\d,]+)
      multiplier: 0.25
  - university: um
    country: my
    url: https://study.um.edu.my/bachelor-of-computer-science-artificial-intelligence
    parser: html
    targets:
    - level: bachelor
      field: computing
      pattern: International RM ([\d,]+)
      multiplier: 0.2857142857
  - university: um
    country: my
    url: https://study.um.edu.my/bachelor-of-business-administration
    parser: html
    targets:
    - level: bachelor
      field: business
      pattern: International RM ([\d,]+)
      multiplier: 0.2857142857
  - university: um
    country: my
    url: https://study.um.edu.my/bachelor-of-science-in-chemistry
    parser: html
    targets:
    - level: bachelor
      field: sciences
      pattern: International RM ([\d,]+)
      multiplier: 0.25
  - university: um
    country: my
    url: https://study.um.edu.my/bachelor-of-arts-english
    parser: html
    targets:
    - level: bachelor
      field: arts
      pattern: International RM ([\d,]+)
      multiplier: 0.2857142857
  - university: um
    country: my
    url: https://study.um.edu.my/master-of-mechanical-enineering-coursework
    parser: html
    targets:
    - level: master
      field: engineering
      pattern: International RM ([\d,]+) \(Full-Time\)
  - university: um
    country: my
    url: https://study.um.edu.my/master-of-computer-science-applied-computing-mixed-mode
    parser: html
    targets:
    - level: master
      field: computing
      pattern: International RM ([\d,]+) \(Full-Time\)
      multiplier: 0.6666666667
  - university: um
    country: my
    url: https://study.um.edu.my/master-of-business-administration-coursework
    parser: html
    targets:
    - level: master
      field: business
      pattern: International RM ([\d,]+) \(Full-Time\)
      multiplier: 0.6666666667
  - university: um
    country: my
    url: https://study.um.edu.my/master-of-science-in-applied-physics-coursework
    parser: html
    targets:
    - level: master
      field: sciences
      pattern: International RM ([\d,]+) \(Full-Time\)
      multiplier: 0.6666666667
  - university: um
    country: my
    url: https://study.um.edu.my/master-of-arts
    parser: html
    targets:
    - level: master
      field: arts
      pattern: International RM ([\d,]+) \(Full-Time\)
      multiplier: 0.5
  # UM department page with a monthly budget table (ranges; midpoints taken)
  - university: um
    country: my
    url: https://spm.um.edu.my/student/international-student-life/
    parser: html
    targets:
    - key: living.housing
      pattern: Accommodation (\d+)–(\d+) [\d–]+ Food [\d–]+ [\d–]+ Transportation [\d–]+ [\d–]+ Utilities/Internet (\d+)–(\d+)
      multiplier: 0.5
    - key: living.food
      pattern: Accommodation [\d–]+ [\d–]+ Food (\d+)–(\d+)
      multiplier: 0.5
    - key: living.transport
      pattern: Accommodation [\d–]+ [\d–]+ Food [\d–]+ [\d–]+ Transportation (\d+)–(\d+)
      multiplier: 0.5
    - key: living.personal
      pattern: Personal Expenses (\d+)–(\d+)
      multiplier: 0.5
