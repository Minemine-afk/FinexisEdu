# Simon Fraser University: SFU Calendar tuition-fee pages (2026 Fall) and the admission cost estimate.
# All entries manual: per-unit and per-term rates multiplied by programme loads by hand (Oct 2026).
sources:
  # SFU Calendar fee table read by hand (Oct 2026)
  - university: sfu
    country: ca
    url: "https://www.sfu.ca/students/calendar/2026/fall/fees-and-regulations/tuition-fees/undergraduate.html"
    manual: true
  # SFU admission cost estimate read by hand (Oct 2026)
  - university: sfu
    country: ca
    url: "https://www.sfu.ca/students/admission/fees-scholarships.html"
    manual: true
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: sfu
    country: ca
    url: https://www.sfu.ca/students/calendar/2026/fall/fees-and-regulations/tuition-fees/graduate.html
    parser: html
    targets:
    - level: master
      field: engineering
      programme: Master of Engineering (MEng), School of Engineering Science
      tier: international
      pattern: 2026.{0,548}?in 2024/2025 or later Domestic Students \$607\.25 \(per unit\) International Students \$([\d,.\' ]*\d)
      multiplier: 15
