# Nagoya University (national university, standard rate). One G30 tuition page covers every programme.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: nagoya
    country: jp
    url: https://en.nagoya-u.ac.jp/admissions/financial/costs/
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so the pattern starts at the fee table's own heading and stops matching if that table is rewritten.
  - university: nagoya
    country: jp
    url: https://admissions.g30.nagoya-u.ac.jp/studentlife/tuition/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: School of Engineering, G30 Automotive Engineering Program (Mechanical Engineering)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: sciences
      programme: School of Science, G30 Physics Program
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: business
      programme: School of Economics, G30 Social Science Program
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: law
      programme: School of Law, G30 Social Science Program
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: arts
      programme: School of Humanities, G30 Japan-in-Asia Cultural Studies (JACS) Program
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: computing
      programme: School of Engineering, G30 Automotive Engineering Program (Electrical, Electronic and Information Engineering)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: medicine
      programme: School of Medicine, Medicine (6-year)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: bachelor
      field: nursing
      programme: School of Medicine, Health Sciences (Nursing)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: master
      field: engineering
      programme: Graduate School of Engineering, G30 Automotive Engineering Program (Master's)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: master
      field: sciences
      programme: Graduate School of Science, G30 Physics and Mathematics Program (Master's)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: master
      field: business
      programme: Graduate School of Economics, G30 Economics and Business Administration Program (Master's)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
    - level: master
      field: arts
      programme: Graduate School of Humanities, G30 Japan-in-Asia Cultural Studies Program (Master's)
      tier: international
      pattern: Annual Tuition Fee JPY (\d{1,3}(?:,\d{3})+)(?![\d,]) Non-Refundable Registration
