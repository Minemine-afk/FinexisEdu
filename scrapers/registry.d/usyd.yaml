# The University of Sydney. Each course page on sydney.edu.au/courses loads its fee table from a
# sibling `.coredata.json` (the HTML itself has no figures). The JSON lists the current and next
# year side by side ("feesByYear"); the records moved to the published 2027 fees on 2026-10-15, so
# every pattern (and the year_pattern) is anchored on the 2027 block; when 2027 drops off, the
# patterns stop matching and the figures are re-checked by hand. The 2026 International Admission
# Guide (B Engineering, B Advanced Computing, BA/LLB, still 2026), the SSAF and living-cost sources
# are in ../registry.yaml.
sources:
  # 2027-entry page (the 2026-entry page, uc/bachelor-of-commerce, lists 2026 only).
  - university: usyd
    country: au
    url: https://www.sydney.edu.au/courses/courses/uc/bachelor-of-commerce0.coredata.json
    parser: html
    year_pattern: '"year":(2027),"fees"'
    targets:
    - level: bachelor
      field: business
      pattern: '"year":2027,"fees":\[.*?"type":"INTFEE","title":"International Full Fee Paying Rate","amount":"\$([\d,]+)"'
  - university: usyd
    country: au
    url: https://www.sydney.edu.au/courses/courses/uc/bachelor-of-science.coredata.json
    parser: html
    year_pattern: '"year":(2027),"fees"'
    targets:
