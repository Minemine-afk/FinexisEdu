  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: usyd
    country: au
    url: https://www.sydney.edu.au/courses/courses/uc/bachelor-of-psychology.coredata.json
    parser: html
    targets:
    - level: bachelor
      field: psychology
      programme: Bachelor of Psychology
      tier: international
      pattern: 2027.{0,1021}?Paying Rate","amount":"\$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: usyd
    country: au
    url: https://www.sydney.edu.au/courses/courses/pc/master-of-clinical-psychology.coredata.json
    parser: html
    targets:
    - level: master
      field: psychology
      programme: Master of Clinical Psychology
      tier: international
      pattern: '"year":2027,"fees":\[.*?"type":"INTFEE","title":"International Full Fee Paying Rate","amount":"\$(\d{1,3}(?:,\d{3})+)(?![\d,])"'
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
