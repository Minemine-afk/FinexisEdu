# Massey University. Each qualification page states the year's estimated international tuition
# for 120 credits and the on-campus student services fee for 120 credits.
sources:
  - university: massey
    country: nz
    url: https://www.massey.ac.nz/study/all-qualifications-and-degrees/bachelor-of-information-sciences-UBINS/computer-science-UBINS1JCMSC1/
    parser: html
    year_pattern: (\d{4}) tuition fees Domestic students
    targets:
    - level: bachelor
      field: computing
      pattern: 'International students: \$([\d,]+)'
    - level: bachelor
      field: computing
      key: annualCompulsoryFees
      pattern: This fee is \$([\d,]+) for on-campus students
