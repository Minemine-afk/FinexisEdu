# Kyushu University (national university, standard rate). One fee page covers every programme.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: kyushu
    country: jp
    url: https://www.isc.kyushu-u.ac.jp/invitation/cost/
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so the pattern starts at the fee table's own heading and stops matching if that table is rewritten.
  - university: kyushu
    country: jp
    url: https://www.kyushu-u.ac.jp/en/admission/fees/expenses/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: School of Engineering, International Undergraduate Program (Mechanical and Aerospace Engineering, Civil Engineering, Applied Chemistry)
      tier: international
      pattern: Tuition Fees Category Amount \(half-year\) Amount \(annual\) School / Graduate school [\d,]+ Yen (\d{1,3}(?:,\d{3})+)(?![\d,]) Yen
    - level: bachelor
      field: computing
      programme: School of Engineering, International Undergraduate Program (Electrical Engineering and Computer Science)
      tier: international
