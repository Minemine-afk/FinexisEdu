# Technical University of Munich. Programme pages carry both the programme-specific non-EU
# tuition fee and the student-union semester fee (both per semester, so multiplier 2).
sources:
  - university: tum
    country: de
    url: https://www.tum.de/en/studies/degree-programs/detail/informatics-bachelor-of-science-bsc
    parser: html
    targets:
    - level: bachelor
      field: computing
      pattern: for this degree program are ([\d,]+) euros per semester
      multiplier: 2
    - level: bachelor
      field: computing
      key: annualCompulsoryFees
      pattern: 'Student Fees: ([\d.]+) €'
      multiplier: 2
