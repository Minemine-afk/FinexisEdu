# Taylor's University. One "International Students (USD)" fee-schedule PDF per school; despite
# the name every column is in RM (the USD column is indicative). Each programme table runs
# from "<PROGRAMME> International Student" to "GRAND TOTAL <enrolment> <total tuition> <insurance>",
# and its first semester row is "<Mon YYYY - Mon YYYY> 1 <enrolment> <tuition> <insurance>
# <international student charge> <annual fee> <EMGS visa & e-VAL> <security deposit>".
# Tuition totals are divided by the programme length in years.
sources:
