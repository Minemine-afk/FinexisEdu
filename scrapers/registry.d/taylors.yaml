    country: my
    url: https://university.taylors.edu.my/content/dam/taylorsrevamp/university/study/scholarships-and-financial-aid/fees-schedule/school-of-computer-science/undergraduate/taylors-fees-schedule-ug-computer-science-usd.pdf
    parser: pdf
    year_pattern: FEE SCHEDULE FOR (\d{4})
    targets:
    - level: bachelor
      field: computing
      tier: international
      pattern: BACHELOR OF COMPUTER SCIENCE \(HONOURS\) International Student.*?GRAND TOTAL 2,800 ([\d,]+) 644
      multiplier: 0.3333333333333333
    - level: bachelor
      field: computing
      tier: international
      key: annualCompulsoryFees
      pattern: BACHELOR OF COMPUTER SCIENCE \(HONOURS\) International Student.*?\w{3} \d{4} - \w{3} \d{4} 1 [\d,]+ [\d,]+ [\d,]+ [\d,]+ ([\d,]+) [\d,]+ 3,000
    - level: bachelor
      field: computing
