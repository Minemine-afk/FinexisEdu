  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: nyu
    country: us
    url: https://steinhardt.nyu.edu/admissions/tuition-and-student-charges/graduate-study-tuition-and-fees
    parser: html
    targets:
    - level: master
      field: arts
