  # NYU Bursar PDFs refuse automated reading; school pages checked by hand
  - university: nyu
    country: us
    url: "https://www.nyu.edu/admissions/financial-aid-and-scholarships/cost-of-attendance.html"
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: nyu
    country: us
    url: https://www.stern.nyu.edu/portal-partners/financial-aid/cost-attendance/full-time/mba1
    parser: html
    targets:
    - level: master
      field: business
      programme: Full-time MBA (Stern School of Business)
      tier: international
      pattern: 2026.{0,253}?Tuition \& Fees Tuition \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: nyu
    country: us
    url: https://www.law.nyu.edu/financialaid/budgetandbudgeting/studentexpensebudget
    parser: html
    targets:
    - level: master
      field: law
      programme: JD (NYU School of Law)
      tier: international
      pattern: 2026.{0,250}?Expense Budget Tuition \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: nyu
    country: us
    url: https://www.stern.nyu.edu/portal-partners/financial-aid/cost-attendance/ms-accounting
    parser: html
    targets:
    - level: master
      field: business
      programme: MS in Accounting (Stern School of Business)
      tier: international
