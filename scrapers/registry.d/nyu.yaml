# New York University: added Oct 2026. All sources are checked by hand (NYU Bursar PDFs refuse automated reading; school pages checked by hand).
sources:
  # NYU Bursar PDFs refuse automated reading; school pages checked by hand
  - university: nyu
    country: us
    url: "https://bulletins.nyu.edu/nyu/cost-attendance/"
