# Humboldt University of Berlin. hu-berlin.de blocks automated access (Anubis bot challenge),
# so the semester contribution comes from DAAD's International Programmes entry for HU's
# MEMS master's, which itemises it.
sources:
  - university: hu-berlin
    country: de
    url: https://www2.daad.de/deutschland/studienangebote/international-programmes/en/detail/6323/
    parser: html
    targets:
    # no field, so it also covers the Rechtswissenschaft (Staatsexamen) entry; medicine is excluded below
    - level: bachelor
      field: law
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
    - level: bachelor
      field: computing
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
    - level: bachelor
      field: business
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
    - level: bachelor
      field: sciences
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
    - level: bachelor
      field: arts
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
    - level: master
      key: annualCompulsoryFees
      pattern: 'Total amount: ([\d.]+) EUR'
      multiplier: 2
  # Medicine is taught by Charité, whose admissions office publishes the enrolment fee for
  # HU-enrolled students (381,80 € for winter 2026/27, written with a comma decimal that the
  # extractor cannot read, and only the first-semester amount), so it is checked by hand.
  - university: hu-berlin
    country: de
    url: https://campusnet.charite.de/fileadmin/user_upload/microsites/ohne_AZ/sonstige/campusnet/downloads/alle_Immatrikulation/Erstsemester_Immatrikulationsgebuehren.pdf
    parser: pdf
    manual: true
  # Charité re-registration fee sheet for summer 2026 (355,80 €, itemised); cited for the 2025 medicine history only
  - university: hu-berlin
    country: de
    url: https://campusnet.charite.de/fileadmin/user_upload/microsites/ohne_AZ/sonstige/campusnet/downloads/250_D_Geb%C3%BChren_HU_SoSe_2026.pdf
    parser: pdf
    manual: true
  # DAAD national average student expenses (HU publishes no breakdown we can read)
  - university: hu-berlin
    country: de
    url: https://www.daad.de/en/study-and-research-in-germany/plan-your-studies/costs-of-education-and-living/
    parser: html
    targets:
    - key: living.housing
      pattern: 'Rent \(including utility costs\): EUR ([\d,]+)'
    - key: living.food
      pattern: 'Food: EUR ([\d,]+)'
    - key: living.transport
      pattern: 'Transportation costs \(car/public transport\): EUR ([\d,]+)'
    - key: living.personal
      pattern: 'Recreation, culture and sports: EUR ([\d,]+) Clothing: EUR ([\d,]+) Semester contribution: EUR [\d,]+ Working materials \(books etc\.\): EUR ([\d,]+) Telephone/Internet/radio and TV licence, postage: EUR ([\d,]+) Other expenses: EUR ([\d,]+)'
