# University of Toronto: Arts & Science and School of Graduate Studies international fee
# schedules from the Registrar's Tuition Explorer (server-rendered; one page per programme and
# year). Each page reads "<programme> International Full-time Program Fee ... <row label>
# $<program fee> $<incidental and system access fee> $<UHIP> $<total>". Earlier years are
# archived as PDFs under registrar.utoronto.ca/fees-payments/tuition-fee-schedules/.
sources:
  # Faculty of Arts & Science Year 1 admission streams (University College): one program fee for
  # all streams, so it serves the HBA, HBSc, Computer Science and Rotman Commerce records.
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=UG&residency=INT&campus=UTSG&faculty=ARTSC-UG&college=UC&program=207
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: bachelor
      field: arts
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$([\d,.]+)
    - level: bachelor
      field: arts
      key: annualCompulsoryFees
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$[\d,.]+ \$([\d,.]+)
    - level: bachelor
      field: business
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$([\d,.]+)
    - level: bachelor
      field: business
      key: annualCompulsoryFees
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$[\d,.]+ \$([\d,.]+)
    - level: bachelor
      field: computing
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$([\d,.]+)
    - level: bachelor
      field: computing
      key: annualCompulsoryFees
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$[\d,.]+ \$([\d,.]+)
    - level: bachelor
      field: sciences
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$([\d,.]+)
    - level: bachelor
      field: sciences
      key: annualCompulsoryFees
      pattern: Admission Streams Year 1:.*?International Full-time Program Fee .*?Students with fewer than 4\.0 credits completed \$[\d,.]+ \$([\d,.]+)
  # SGS doctoral-stream MA (St. George): the fee table used by the MA in Economics
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=ARTSC-G&program=4
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: master
      field: arts
      pattern: Master of Arts \(Doctoral Stream\) - MA International Full-time Program Fee .*?or earlier \$([\d,.]+)
    - level: master
      field: arts
      key: annualCompulsoryFees
      pattern: Master of Arts \(Doctoral Stream\) - MA International Full-time Program Fee .*?or earlier \$[\d,.]+ \$([\d,.]+)
  # SGS doctoral-stream MSc (St. George): the fee table used by the MSc in Physics
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=ARTSC-G&program=63
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: master
      field: sciences
      pattern: Master of Science - MSc \(Doctoral Stream\) International Full-time Program Fee .*?or earlier \$([\d,.]+)
    - level: master
      field: sciences
      key: annualCompulsoryFees
      pattern: Master of Science - MSc \(Doctoral Stream\) International Full-time Program Fee .*?or earlier \$[\d,.]+ \$([\d,.]+)
  # Rotman Full-Time MBA (2-year): program fee per academic year for the newly admitted cohort
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=MGT-G&program=98
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: master
      field: business
      programme: Master of Business Administration
      pattern: Master of Business Administration - MBA \(2-Year Degree Program\) International Full-time Program Fee .*?Admitted \d{4} Summer or \d{4}-\d{2} Fall & Winter Session \$([\d,.]+)
    - level: master
      field: business
      programme: Master of Business Administration
      key: annualCompulsoryFees
      pattern: Master of Business Administration - MBA \(2-Year Degree Program\) International Full-time Program Fee .*?Admitted \d{4} Summer or \d{4}-\d{2} Fall & Winter Session \$[\d,.]+ \$([\d,.]+)
  # MScAC (16 months): Fall-Winter fee covers the Summer session; the final Fall term is billed at
  # half the Fall-Winter fee, so the programme costs 1.5 x the Fall-Winter fee over 1.3333 years
  # (multiplier 1.5 / 1.3333 = 1.125).
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=ARTSC-G&program=139
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: master
      field: computing
      pattern: Master of Science Applied Computing - MScAC International Full-time Program Fee .*?or earlier \$([\d,.]+)
      multiplier: 1.125
    - level: master
      field: computing
      key: annualCompulsoryFees
      pattern: Master of Science Applied Computing - MScAC International Full-time Program Fee .*?or earlier \$[\d,.]+ \$([\d,.]+)
  # MEng (12 months, full-time): program fee per academic year
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=APSC-G&program=103
    parser: html
    year_pattern: (\d{4})/\d{2} Fall and Winter
    targets:
    - level: master
      field: engineering
      pattern: Master of Engineering - MEng International Full-time Program Fee .*?or earlier \$([\d,.]+)
    - level: master
      field: engineering
      key: annualCompulsoryFees
      pattern: Master of Engineering - MEng International Full-time Program Fee .*?or earlier \$[\d,.]+ \$([\d,.]+)
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTSG&faculty=OISET-G&program=100
    parser: html
    targets:
    - level: master
      field: psychology
      programme: Master of Education (MEd) in Counselling Psychology, Counselling and Psychotherapy field, OISE
      tier: international
      pattern: 2026.{0,231}?Fall \& Winter Session \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=G&residency=INT&campus=UTM&faculty=ERIN-G&program=129
    parser: html
    targets:
    - level: master
      field: business
      programme: Master of Management and Professional Accounting (MMPA), University of Toronto Mississauga
      tier: international
      pattern: 2026.{0,243}?Session, or earlier \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: utoronto
    country: ca
    url: https://tuitionexplorer.registrar.utoronto.ca/index.php?academicYear=2026-27&sessionType=1&studyLevel=UG&residency=INT&campus=UTSG&faculty=ARTSC-UG&college=UC&program=207
    parser: html
    targets:
    - level: bachelor
      field: psychology
      programme: Honours Bachelor of Science (Psychology), Faculty of Arts & Science
      tier: international
      pattern: Students with fewer than 4\.0 credits completed \$(\d{1,3}(?:,\d{3})*\.\d\d)(?!\d)
