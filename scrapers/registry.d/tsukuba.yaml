# University of Tsukuba (national university, standard rate until the April 2027 international revision). Read by hand.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: tsukuba
    country: jp
    url: https://www.tsukuba.ac.jp/en/admissions/fees-living-expenses/
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: tsukuba
    country: jp
    url: https://www.tsukuba.ac.jp/en/admissions/fees-tuition/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: Interdisciplinary Engineering Program (English-taught)
      tier: international
      pattern: '2026.{0,598}?¥[\d,.\'' ]*\d Annual: ¥([\d,.\'' ]*\d)'
    - level: bachelor
      field: sciences
      programme: Biology Program (English-taught)
      tier: international
      pattern: '2026.{0,598}?¥[\d,.\'' ]*\d Annual: ¥([\d,.\'' ]*\d)'
    - level: bachelor
      field: arts
      programme: International Social Studies Program (English-taught)
