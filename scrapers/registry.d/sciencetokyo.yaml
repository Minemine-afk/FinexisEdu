# Institute of Science Tokyo (national university; science and engineering rate ¥635,400). Read by hand.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: sciencetokyo
    country: jp
    url: https://www.u-tokyo.ac.jp/adm/inbound/en/finance-living.html
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: sciencetokyo
    country: jp
    url: https://admissions.isct.ac.jp/en/013/undergraduate/programs/gsep
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: Global Scientists and Engineers Program (GSEP), Bachelor's Program in Transdisciplinary Science and Engineering
      tier: international
      pattern: Application, Enrollment Fees, and Tuition Application Fee JPY [\d,]+ Enrollment Fee JPY [\d,]+ Annual Tuition JPY (\d{1,3}(?:,\d{3})+)(?![\d,])
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: sciencetokyo
    country: jp
    url: https://www.titech.ac.jp/english/graduate_school/admissions/tuition.html
    parser: html
    targets:
    - level: bachelor
      field: computing
      programme: School of Computing
      tier: international
      pattern: Undergraduate student Bachelor's degree program JPY [\d,]+ JPY [\d,]+ JPY (\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: sciences
      programme: School of Science
      tier: international
      pattern: Undergraduate student Bachelor's degree program JPY [\d,]+ JPY [\d,]+ JPY (\d{1,3}(?:,\d{3})+)(?![\d,])
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: sciencetokyo
    country: jp
    url: https://admissions.isct.ac.jp/en/013/graduate/programs/science-and-engineering
    parser: html
    targets:
    - level: master
      field: engineering
      programme: School of Engineering (Master's; English-taught International Graduate Program available)
      tier: international
      pattern: 'Application fee : JPY [\d,]+ Enrollment fee : JPY [\d,]+ Annual tuition : JPY (\d{1,3}(?:,\d{3})+)(?![\d,])'
    - level: master
      field: computing
      programme: School of Computing (Master's; English-taught International Graduate Program available)
      tier: international
      pattern: 'Application fee : JPY [\d,]+ Enrollment fee : JPY [\d,]+ Annual tuition : JPY (\d{1,3}(?:,\d{3})+)(?![\d,])'
    - level: master
      field: sciences
      programme: School of Science (Master's; English-taught International Graduate Program available)
      tier: international
      pattern: 'Application fee : JPY [\d,]+ Enrollment fee : JPY [\d,]+ Annual tuition : JPY (\d{1,3}(?:,\d{3})+)(?![\d,])'
