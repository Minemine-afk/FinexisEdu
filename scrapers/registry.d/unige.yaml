sources:
  # UNIGE semester fees, identical for all students (CHF 65 fixed + CHF 435 supervision).
  # The untargeted pattern also covers the droit and médecine humaine entries.
  - university: unige
    country: ch
    url: https://www.unige.ch/immatriculations/informations/taxes
    parser: html
    targets:
    - pattern: Les taxes s’élèvent à CHF ([\d’']+)\.- par semestre
      multiplier: 2
  # Fee-history sources: UNIGE's annual budgets (Division comptabilité et gestion
  # financière) state the year's taxes universitaires (CHF 500 per semester = CHF 65 fixed
  # + CHF 435 encadrement). Budget 2024 p. 11 backs the 2024 rows, Budget 2025 p. 9 the
  # 2025 rows. Fixed-year documents, so checked by hand rather than scraped.
  - university: unige
    country: ch
    url: https://www.unige.ch/difin/download_file/view/144/367
    parser: pdf
    manual: true
  - university: unige
    country: ch
    url: https://www.unige.ch/difin/download_file/view/161/367
    parser: pdf
    manual: true
  # Monthly cost-of-living estimate published for incoming students.
  - university: unige
    country: ch
    url: https://www.unige.ch/exchange/incoming/pourquoi-venir-lunige/etudiants/mobilite-monde-etudiants/4-preparer-son-sejour/budget
    parser: html
    targets:
    - key: living.housing
      pattern: Loyer CHF ([\d’']+)\.- Electricité/téléphone CHF ([\d’']+)\.-
    - key: living.food
      pattern: Entretien \(alimentation, etc\.\) CHF ([\d’']+)\.-
    - key: living.transport
      pattern: Frais de déplacement CHF ([\d’']+)\.-
    - key: living.personal
      pattern: Frais d'études CHF ([\d’']+)\.-.*?Habillement/activités culturelles/ loisirs CHF ([\d’']+)\.-
