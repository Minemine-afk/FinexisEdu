    url: https://www.sim.edu.sg/degrees-diplomas/programmes/programme-listing/uofa_bachelor-of-commerce
    parser: html
    targets:
    - level: bachelor
      field: business
      programme: Bachelor of Commerce (Top-up)
      tier: citizen
      pattern: 2026.{0,235}?Fees \(incl\. GST\)\* S\$([\d,.\' ]*\d)
      multiplier: 0.5
    - level: bachelor
      field: business
      programme: Bachelor of Commerce (Top-up)
      tier: pr
      pattern: 2026.{0,235}?Fees \(incl\. GST\)\* S\$([\d,.\' ]*\d)
      multiplier: 0.5
    - level: bachelor
      field: business
      programme: Bachelor of Commerce (Top-up)
      tier: international
      pattern: 2026.{0,268}?\(Singaporean \& PR\) / S\$([\d,.\' ]*\d)
      multiplier: 0.5
