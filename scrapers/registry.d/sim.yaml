  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: sim
    country: sg
    url: https://www.sim.edu.sg/degrees-diplomas/programmes/programme-listing/master-of-computing-(data-analytics)
    parser: html
    targets:
    - level: master
      field: computing
      programme: Master of Computing (Data Analytics) (Top-up)
      tier: citizen
      pattern: 2026.{0,237}?Fees \(incl\. GST\)\* \# S\$([\d,.\' ]*\d)
    - level: master
      field: computing
      programme: Master of Computing (Data Analytics) (Top-up)
      tier: pr
      pattern: 2026.{0,237}?Fees \(incl\. GST\)\* \# S\$([\d,.\' ]*\d)
    - level: master
      field: computing
      programme: Master of Computing (Data Analytics) (Top-up)
      tier: international
      pattern: 2026.{0,237}?Fees \(incl\. GST\)\* \# S\$([\d,.\' ]*\d)
