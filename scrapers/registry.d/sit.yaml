      field: engineering
      tier: citizen
      pattern: Electrical and Electronic 240 S\$([\d.]+) S\$[\d.]+ S\$[\d.]+ S\$[\d.]+
      multiplier: 60
    - level: bachelor
      field: engineering
      tier: pr
