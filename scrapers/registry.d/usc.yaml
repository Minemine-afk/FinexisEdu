sources:
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: usc
    country: us
    url: https://financialaid.usc.edu/cost/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: Mechanical Engineering (BS)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: computing
      programme: Computer Science (BS)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: business
      programme: Business Administration (BS)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: sciences
      programme: Biological Sciences (BS)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: arts
      programme: English (BA)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: psychology
      programme: Psychology (BA)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
    - level: bachelor
      field: business
      programme: Accounting (BS)
      tier: international
      pattern: 2026.{0,450}?for two semesters\) \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: usc
    country: us
    url: https://viterbigradadmission.usc.edu/wp-content/uploads/2026/03/2026-2027-Tuition-and-Fees-33.pdf
    parser: pdf
    targets:
    - level: master
      field: engineering
      programme: MS in Mechanical Engineering
      tier: international
      pattern: 2026.{0,293}?Engineering Tuition \$([\d,.\' ]*\d)
      multiplier: 18
    - level: master
      field: computing
      programme: MS in Computer Science
      tier: international
      pattern: 2026.{0,293}?Engineering Tuition \$([\d,.\' ]*\d)
      multiplier: 18
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: usc
    country: us
    url: https://arr.usc.edu/students/tuition-and-fees/
    parser: html
    targets:
    - level: master
      field: business
      programme: Master of Accounting (MAcc)
      tier: international
      pattern: 2026.{0,243}?Students \(12\-18 units\) \$([\d,.\' ]*\d)
      multiplier: 2
