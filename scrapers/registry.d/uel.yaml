# University of East London. Fees come from the UEL Fees Schedule (Schedule 1 to the Tuition Fees
# Policy), one PDF per academic year linked from uel.ac.uk/about/governance/tuition-fee-policy. Read by hand;
# bump the PDF URL when the next year's schedule is published.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: uel
    country: uk
    url: https://www.uel.ac.uk/blog/real-cost-living-east-london-what-uel-students-need-know
    parser: html
    manual: true
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: uel
    country: uk
    url: https://www.uel.ac.uk/sites/default/files/uel-fees-schedule-2026-27.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: computing
      programme: BSc (Hons) Computer Science
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: engineering
      programme: BEng (Hons) Mechanical Engineering
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: sciences
      programme: BSc (Hons) Biomedical Science
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: business
      programme: BSc (Hons) Business Management
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: arts
      programme: BA (Hons) Graphic Design
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: psychology
      programme: BSc (Hons) Psychology
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
    - level: bachelor
      field: nursing
      programme: BSc (Hons) Nursing (Adult)
      tier: international
      pattern: 2026.{0,233}?fee = £[\d,.\' ]*\d\*\* \*£([\d,.\' ]*\d)
    - level: master
      field: computing
      programme: MSc Computer Science
      tier: international
      pattern: 2026.{0,1035}?£[\d,.\' ]*\d\* to £([\d,.\' ]*\d)
    - level: master
      field: business
      programme: MBA
      tier: international
      pattern: 2026.{0,501}?and Law £[\d,.\' ]*\d to £([\d,.\' ]*\d)
    - level: bachelor
      field: business
      programme: BSc (Hons) Accounting and Finance
      tier: international
      pattern: 2026.{0,1027}?Policy \*\*\) All Schools Full\-Time £([\d,.\' ]*\d)
