# National University of Singapore: sources added after the main registry entries.
# Duke-NUS Medical School (duke-nus.edu.sg) sits behind Incapsula bot protection
# (direct requests get a challenge page); the MD tuition page was read through a
# reader proxy (r.jina.ai). It shows only the current intake's annual fees
# ("For students admitted ... in Academic Year 2026-2027"), SC / PR / international.
sources:
  - university: nus
    country: sg
    url: https://www.duke-nus.edu.sg/admissions/why-duke-nus/tuition-scholarships
    parser: html
    manual: true
  # Master of Psychology (Clinical): psychology programme added Oct 2026; fee read by hand
  - university: nus
    country: sg
    url: "https://fass.nus.edu.sg/fees-gradcoursework/"
    manual: true
  # Accountancy programmes added Oct 2026; fees read by hand
  - university: nus
    country: sg
    url: "https://mscacc.nus.edu.sg/fees-finances/programme-fees/"
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: nus
    country: sg
    url: https://www.nus.edu.sg/registrar/docs/info/administrative-policies-procedures/ugtuitioncurrent.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: psychology
      programme: Bachelor of Social Sciences (Psychology major)
      tier: citizen
      pattern: 2026.{0,1711}?Humanities and Sciences (\d{1,3}(?:,\d{3})+)(?![\d,]) [\d,]+ [\d,]+ [\d,]+
    - level: bachelor
      field: psychology
      programme: Bachelor of Social Sciences (Psychology major)
      tier: pr
      pattern: 2026.{0,1711}?Humanities and Sciences [\d,]+ (\d{1,3}(?:,\d{3})+)(?![\d,]) [\d,]+ [\d,]+
    - level: bachelor
      field: psychology
      programme: Bachelor of Social Sciences (Psychology major)
      tier: international
      pattern: 2026.{0,1711}?Humanities and Sciences [\d,]+ [\d,]+ [\d,]+ (\d{1,3}(?:,\d{3})+)(?![\d,])
