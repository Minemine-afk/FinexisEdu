# Griffith College Dublin (private, QQI-validated). Non-EU fee packs are PDFs linked from
# https://www.griffith.ie/admissions/fees/non-eu-tuition-fees; the filenames change with each new pack.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: griffith
    country: ie
    url: https://www.griffith.ie/sites/default/files/2026-07/cost-of-living-v3.1-clickable.pdf
    parser: pdf
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: griffith
    country: ie
    url: https://www.griffith.ie/sites/default/files/2025-11/gop-nef-b-25.11.v1-compressed.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: computing
      programme: BSc (Hons) in Computing Science
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
    - level: bachelor
      field: business
      programme: BA (Hons) in Business
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
    - level: bachelor
      field: arts
      programme: BA (Hons) in Communications and Media Production
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
    - level: bachelor
      field: law
      programme: LL.B. (Hons) in Law
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
    - level: bachelor
      field: psychology
      programme: BA (Hons) in Psychology
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
    - level: bachelor
      field: business
      programme: BA (Hons) in Accounting & Finance
      tier: international
      pattern: Undergraduate Tuition Fees Annual Tuition Fee €(\d{1,3}(?:,\d{3})+)(?![\d,]) For all undergraduate
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: griffith
    country: ie
    url: https://www.griffith.ie/sites/default/files/2025-06/gop-nef-m-19.06.v1-compressed.pdf
    parser: pdf
    targets:
    - level: master
      field: computing
      programme: MSc in Computing
      tier: international
      pattern: Postgraduate Tuition Fees Masters Degree/ €(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: business
      programme: MBA in International Business
      tier: international
      pattern: Postgraduate Tuition Fees Masters Degree/ €(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: law
      programme: LL.M. in International Law
      tier: international
      pattern: Postgraduate Tuition Fees Masters Degree/ €(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: arts
      programme: MA in Journalism & Digital Communications
      tier: international
      pattern: Postgraduate Tuition Fees Masters Degree/ €(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: sciences
      programme: MSc in Pharmaceutical Business and Technology
      tier: international
      pattern: 'MSc in Pharmaceutical illustrated below: Business & Technology €(\d{1,3}(?:,\d{3})+)(?![\d,])'
    - level: master
      field: business
      programme: MSc in Accounting & Finance Management
      tier: international
      pattern: Postgraduate Tuition Fees Masters Degree/ €(\d{1,3}(?:,\d{3})+)(?![\d,])
