# Johns Hopkins University: added Oct 2026. All sources are checked by hand (JHU catalogue and school cost pages read by hand).
sources:
  # JHU catalogue and school cost pages read by hand
  - university: jhu
    country: us
    url: "https://nursing.jhu.edu/wp-content/uploads/2026/04/26-27-MEN-New-F26.pdf"
    manual: true
  # JHU catalogue and school cost pages read by hand
  - university: jhu
    country: us
    url: "https://www.hopkinsmedicine.org/som/offices/finaid/cost"
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: jhu
    country: us
    url: https://sfs.jhu.edu/cost-tuition/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: BS in Mechanical Engineering (Whiting School of Engineering)
      tier: international
      pattern: 2026.{0,363}?\(Freshman\) Tuition\* \$([\d,.\' ]*\d)
    - level: bachelor
      field: computing
      programme: BS in Computer Science (Whiting School of Engineering)
      tier: international
      pattern: 2026.{0,363}?\(Freshman\) Tuition\* \$([\d,.\' ]*\d)
    - level: bachelor
      field: sciences
      programme: BS in Physics (Krieger School of Arts and Sciences)
      tier: international
      pattern: 2026.{0,363}?\(Freshman\) Tuition\* \$([\d,.\' ]*\d)
    - level: bachelor
      field: arts
      programme: BA in History (Krieger School of Arts and Sciences)
      tier: international
      pattern: 2026.{0,363}?\(Freshman\) Tuition\* \$([\d,.\' ]*\d)
    - level: bachelor
      field: psychology
      programme: BA in Psychology (Krieger School of Arts and Sciences)
      tier: international
      pattern: 2026.{0,363}?\(Freshman\) Tuition\* \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: jhu
    country: us
    url: https://e-catalogue.jhu.edu/university-wide-policies-information/admission-aid/tuition-fees/
    parser: html
    targets:
    - level: master
      field: psychology
      programme: MS in Psychology (Krieger School of Arts and Sciences)
      tier: international
      pattern: 2026.{0,1471}?\$[\d,.\' ]*\d MS Psychology \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: jhu
    country: us
    url: https://e-catalogue.jhu.edu/university-wide-policies-information/admission-aid/tuition-fees/
    parser: html
    targets:
    - level: master
      field: business
      programme: Full-time Global MBA (Carey Business School)
      tier: international
      pattern: Tuition University Wide Tuition Table Program Tuition Per Credit Hour Per Course Full-time Global MBA \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: arts
      programme: MA in International Relations (School of Advanced International Studies)
      tier: international
      pattern: Tuition University Wide Tuition Table Program Tuition Per Credit Hour Per Course Full-time Graduate/Doctoral Resident - DC \$(\d{1,3}(?:,\d{3})+)(?![\d,])
