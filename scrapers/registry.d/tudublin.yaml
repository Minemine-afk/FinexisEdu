# Technological University Dublin. Fees come from PDF booklets (international UG summary booklet, international PG prospectus)
# and a cost-of-living page; all are read by hand.
sources:
  # cost-of-living estimate read by hand
  - university: tudublin
    country: ie
    url: "https://www.tudublin.ie/for-students/student-services-and-support/financial-support/cost-of-living-guide/"
    manual: true
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: tudublin
    country: ie
    url: https://www.tudublin.ie/media/website/study/international-students/fees--funding/documents/TU-Dublin-International-Undergraduate-Summary-Booklet.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: computing
      programme: BSc Computer Science (TU856)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU856\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: business
      programme: BSc Business & Management (TU903)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU903\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: engineering
      programme: BE Engineering (General Entry) (TU805)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU805\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: sciences
      programme: BSc Biotechnology (TU889)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU889\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: arts
      programme: BA Journalism (TU985)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU985\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: law
      programme: Law (LLB) (TU918)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU918\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: business
      programme: BSc (Hons) Accounting (TU910)
      tier: international
      pattern: International Undergraduate Programmes 2026/27.{0,20000}?TU910\b.{0,160}?€ ?(\d{1,3}(?:,\d{3})+)(?![\d,])
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so the pattern starts at the fee table's own heading and stops matching if that table is rewritten.
  - university: tudublin
    country: ie
    url: https://www.tudublin.ie/media/website/study/international-students/find-a-course/documents/International-Postgraduate-Booklet_Nov-26.pdf
    parser: pdf
    targets:
    - level: master
      field: computing
      programme: MSc Computer Science (Advanced Software Development) (TU059)
      tier: international
      pattern: 'TU059 Computer\ Science\ \(Advanced\ Software\ Development\)(?: \*)? MSc Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
    - level: master
      field: business
      programme: MSc Finance (TU318)
      tier: international
      pattern: 'TU318 Finance(?: \*)? MSc Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
    - level: master
      field: engineering
      programme: MEng Mechanical Engineering (TU204)
      tier: international
      pattern: 'TU204 Mechanical\ Engineering(?: \*)? MEng Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
    - level: master
      field: sciences
      programme: MSc Brewing and Distilling (TU349)
      tier: international
      pattern: 'TU349 Brewing\ and\ Distilling(?: \*)? MSc Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
    - level: master
      field: arts
      programme: MA Journalism (TU295)
      tier: international
      pattern: 'TU295 Journalism(?: \*)? MA Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
    - level: master
      field: business
      programme: MBS Accounting (International) (TU324)
      tier: international
      pattern: 'TU324 Accounting\ \(International\)(?: \*)? MBS Sept 26 [\d-]+ [A-Za-z&'' ]+? (\d{4,5}) \d'
