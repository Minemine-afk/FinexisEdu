# University of Glasgow. Undergraduate international fees are one band table (intlfees page, current and next year);
# postgraduate fees are one table per year (feetable/live is the newest). Added Oct 2026; read by hand.
sources:
  # living-cost budget table read by hand
  - university: glasgow
    country: uk
    url: "https://www.gla.ac.uk/myglasgow/registry/finance/usloans/costofliving202627/"
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: glasgow
    country: uk
    url: https://www.gla.ac.uk/postgraduate/feesandfunding/feetable/live/
    parser: html
    targets:
    - level: master
      field: computing
      programme: Computing Science MSc
      tier: international
      pattern: 2027.{0,695}?£[\d,.\' ]*\d Computing Science MSc £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: master
      field: engineering
      programme: Mechanical Engineering MSc
      tier: international
      pattern: 2027.{0,1461}?Mechanical Engineering MSc £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: master
      field: sciences
      programme: Data Analytics MSc
      tier: international
      pattern: 2027.{0,764}?Analytics MSc £[\d,.\' ]*\d £([\d,.\' ]*\d)
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: glasgow
    country: uk
    url: https://www.gla.ac.uk/undergraduate/fees/intlfees/
    parser: html
    targets:
    - level: bachelor
      field: business
      programme: Accountancy & Finance BAcc
      tier: international
      pattern: 2027.{0,456}?Sciences programmes £([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: glasgow
    country: uk
    url: https://www.gla.ac.uk/undergraduate/fees/intlfees/
    parser: html
    targets:
    - level: bachelor
      field: business
      programme: Business & Management MA (SocSci)
      tier: international
      pattern: 2027.{0,419}?Arts\ and\ Social\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: arts
      programme: Economics MA (SocSci)
      tier: international
      pattern: 2027.{0,419}?Arts\ and\ Social\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: psychology
      programme: Psychology MA (SocSci)
      tier: international
      pattern: 2027.{0,419}?Arts\ and\ Social\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: engineering
      programme: Mechanical Engineering BEng
      tier: international
      pattern: 2027.{0,463}?Science,\ Engineering,\ Nursing\ and\ College\ of\ Medical,\ Veterinary\ and\ Life\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: computing
      programme: Computing Science BSc
      tier: international
      pattern: 2027.{0,463}?Science,\ Engineering,\ Nursing\ and\ College\ of\ Medical,\ Veterinary\ and\ Life\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: sciences
      programme: Physics BSc
      tier: international
      pattern: 2027.{0,463}?Science,\ Engineering,\ Nursing\ and\ College\ of\ Medical,\ Veterinary\ and\ Life\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: nursing
      programme: Nursing BN
      tier: international
      pattern: 2027.{0,463}?Science,\ Engineering,\ Nursing\ and\ College\ of\ Medical,\ Veterinary\ and\ Life\ Sciences programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: medicine
      programme: Medicine MBChB
      tier: international
      pattern: 2027.{0,606}?MBChB\ and\ College\ of\ Medical,\ Veterinary\ and\ Life\ Sciences\ clinical programmes £(\d{1,3}(?:,\d{3})+)(?![\d,])
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The page gives no fee year beside
  # the figure, so this rule has no year check; it stops matching if the row's wording changes, and the refresh guard's limits still apply.
  - university: glasgow
    country: uk
    url: https://www.gla.ac.uk/postgraduate/feesandfunding/feetable/live/
    parser: html
    targets:
    - level: master
      field: business
      programme: Management MSc
      tier: international
      pattern: £[\d,]+ Management\ MSc £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: arts
      programme: Economics MSc
      tier: international
      pattern: £[\d,]+ Economics\ MSc £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: psychology
      programme: Psychological Science (conversion) MSc
      tier: international
      pattern: £[\d,]+ Psychological\ Science\ \(conversion\)\ MSc £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: business
      programme: International Accounting & Financial Management MAcc
      tier: international
      pattern: £[\d,]+ International\ Accounting\ \&\ Financial\ Management\ MAcc £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
