# University of Warwick. Fees are read by hand from two Student Finance tables: the UG
# overseas table (bands per course, three academic years) and the PG taught table (Home and
# Overseas per course, three years). No automated pattern has been written yet.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: warwick
    country: uk
    url: https://warwick.ac.uk/services/wss/funding/moneymatters/managingmoney/living/
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: warwick
    country: uk
    url: https://warwick.ac.uk/services/finance/studentfinance/fees/overseasfees/
    parser: html
    targets:
    - level: bachelor
      field: computing
      programme: Computer Science BSc
      tier: international
      pattern: 2027.{0,1569}?\(BSc\) G400 Band 2 £[\d,.\' ]*\d £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: bachelor
      field: arts
      programme: Economics BSc
      tier: international
      pattern: 2027.{0,358}?\(BSc\) L100 Band 2 £[\d,.\' ]*\d £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: master
      field: medicine
      programme: Bachelor of Medicine and Bachelor of Surgery (MBChB, graduate entry)
      tier: international
      pattern: 2026.{0,288}?1\) A101 MBChB £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: bachelor
      field: business
      programme: Accounting and Finance BSc
      tier: international
      pattern: 2027.{0,266}?Band 2 £[\d,.\' ]*\d £[\d,.\' ]*\d £([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: warwick
    country: uk
    url: https://warwick.ac.uk/services/finance/studentfinance/fees/postgraduatefees
    parser: html
    targets:
    - level: master
      field: engineering
      programme: Advanced Mechanical Engineering MSc
      tier: international
      pattern: 2026.{0,1026}?P\-H341 Full Time Overseas £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: master
      field: law
      programme: Advanced Legal Studies LLM
      tier: international
      pattern: 2026.{0,703}?P\-M3PJ Full Time Overseas £[\d,.\' ]*\d £([\d,.\' ]*\d)
    - level: master
      field: business
      programme: Accounting and Financial Management MSc
      tier: international
      pattern: 2026.{0,381}?Time Overseas £[\d,.\' ]*\d £([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: warwick
    country: uk
    url: https://warwick.ac.uk/services/finance/studentfinance/fees/overseasfees/
    parser: html
    targets:
    - level: bachelor
      field: engineering
      programme: Mechanical Engineering MEng
      tier: international
      pattern: UCAS code 2025-26 2026-27 2027-28 .{0,200000}?(?:£[\d,]+|2027-28) Mechanical Engineering \(MEng\) H302 Band \d £[\d,]+ £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: sciences
      programme: Mathematics BSc
      tier: international
      pattern: UCAS code 2025-26 2026-27 2027-28 .{0,200000}?(?:£[\d,]+|2027-28) Mathematics \(BSc\) \w{4} Band \d £[\d,]+ £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: business
      programme: Management BSc
      tier: international
      pattern: UCAS code 2025-26 2026-27 2027-28 .{0,200000}?(?:£[\d,]+|2027-28) Management \(BSc\) N200 Band \d £[\d,]+ £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: law
      programme: Law LLB
      tier: international
      pattern: UCAS code 2025-26 2026-27 2027-28 .{0,200000}?(?:£[\d,]+|2027-28) Law \(3 years\) \(LLB\) M100 Band \d £[\d,]+ £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: psychology
      programme: Psychology BSc
      tier: international
      pattern: UCAS code 2025-26 2026-27 2027-28 .{0,200000}?(?:£[\d,]+|2027-28) Psychology \(BSc\) C800 Band \d £[\d,]+ £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: warwick
    country: uk
    url: https://warwick.ac.uk/services/finance/studentfinance/fees/postgraduatefees
    parser: html
    targets:
    - level: master
      field: computing
      programme: Computer Science MSc
      tier: international
      pattern: Fee Status 2025-26 2026-27 2027-28 .{0,200000}?Computer Science \(MSc\) P-G5PD Full Time Overseas £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: sciences
      programme: Mathematics MSc
      tier: international
      pattern: Fee Status 2025-26 2026-27 2027-28 .{0,200000}?Mathematics \(MSc\) P-G1P0 Full Time Overseas £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: business
      programme: Management MSc
      exclude:
      - Accounting and Financial Management MSc
      tier: international
      pattern: Fee Status 2025-26 2026-27 2027-28 .{0,200000}?Management \(MSc\) P-N2N3 Full Time Overseas £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: arts
      programme: Economics MSc
      tier: international
      pattern: Fee Status 2025-26 2026-27 2027-28 .{0,200000}?Economics \(MSc\) P-L1P6 Full Time Overseas £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: psychology
      programme: Clinical Applications of Psychology MSc
      tier: international
      pattern: Fee Status 2025-26 2026-27 2027-28 .{0,200000}?Clinical Applications of Psychology \(MSc\) P-C8P5 Full Time Overseas £[\d,]+ £(\d{1,3}(?:,\d{3})+)(?![\d,])
