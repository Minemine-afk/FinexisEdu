# Heidelberg University. Baden-Württemberg non-EU tuition (per semester) plus the semester fee.
sources:
  - university: heidelberg
    country: de
    url: https://www.uni-heidelberg.de/en/study/management-of-studies/semester-fees/tuition-fees-for-international-students
    parser: html
    targets:
    # no level/field, so it also covers the Rechtswissenschaft and Medizin (Staatsexamen) entries
    - pattern: required to pay a tuition fee of EUR ([\d,]+) per semester
      multiplier: 2
  - university: heidelberg
    country: de
    url: https://www.uni-heidelberg.de/en/study/management-of-studies/semester-fees
    parser: html
    targets:
    - key: annualCompulsoryFees
      pattern: The current semester fee is €([\d.]+) at Heidelberg University
      multiplier: 2
  # DAAD national average student expenses (no itemised Heidelberg estimate published)
  - university: heidelberg
    country: de
    url: https://www.daad.de/en/study-and-research-in-germany/plan-your-studies/costs-of-education-and-living/
    parser: html
    targets:
    - key: living.housing
      pattern: 'Rent \(including utility costs\): EUR ([\d,]+)'
    - key: living.food
      pattern: 'Food: EUR ([\d,]+)'
    - key: living.transport
      pattern: 'Transportation costs \(car/public transport\): EUR ([\d,]+)'
    - key: living.personal
      pattern: 'Recreation, culture and sports: EUR ([\d,]+) Clothing: EUR ([\d,]+) Semester contribution: EUR [\d,]+ Working materials \(books etc\.\): EUR ([\d,]+) Telephone/Internet/radio and TV licence, postage: EUR ([\d,]+) Other expenses: EUR ([\d,]+)'
