# University of Canterbury. The fee-estimate pages show 2026, 2027 and 2028 side by side, so the
# patterns are anchored on the 2027 figure; when it drops off the page they stop matching and the
# figures are re-checked by hand.
sources:
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/international-tuition-fees/bachelors
    parser: html
    year_pattern: (2027) tuition fee estimate
    targets:
    - level: bachelor
      field: computing
      pattern: 'Bachelor of Data Science \(BDataSc\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: bachelor
      field: business
      pattern: 'Bachelor of Commerce \(BCom\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: bachelor
      field: engineering
      pattern: 'Bachelor of Engineering with Honours \(BE\(Hons\)\).*?First Year.*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: bachelor
      field: sciences
      pattern: 'Bachelor of Science \(BSc\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: bachelor
      field: arts
      pattern: 'Bachelor of Arts \(BA\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: bachelor
      field: law
      pattern: 'Bachelor of Laws \(LLB\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/international-tuition-fees/masters
    parser: html
    year_pattern: (2027) tuition fee estimate
    targets:
    - level: master
      field: computing
      pattern: 'Master of Computer Science \(PMCS\).*?2027 Special Programme Fee: \$([\d,]+) \(180 points\)'
      multiplier: 0.6666666666666666
    - level: master
      field: business
      pattern: 'Master of Business Administration \(MBA\).*?2027 Special Programme Fee: \$([\d,]+) \(180 points\)'
      multiplier: 0.6666666666666666
    - level: master
      field: engineering
      pattern: 'Master of Engineering \(ME\).*?2027 Special Programme Fee: \$([\d,]+) \(120 points\)'
    - level: master
      field: sciences
      pattern: 'Master of Science \(MSc\).*?2027 tuition fee estimate: \$([\d,]+) per 120 points'
    - level: master
      field: arts
      pattern: 'Master of Arts \(Thesis\) \(MA\(Thesis\)\).*?2027 Special Programme Fee: \$([\d,]+) \(120 points\)'
    - level: master
      field: law
      pattern: 'Master of Laws \(LLM\).*?2027 Special Programme Fee: \$([\d,]+) \(120 points\)'
  # UC Calendar (Maramataka) 2024 and 2025: Fees and Fines Regulations, Schedule 1 Part C
  # (international fee bands per 120 points) and Part D (special programme fees), plus
  # Schedule 3 (Student Services Levy per point). Used only for the 2024 and 2025 feeHistory
  # rows; earlier years' Calendars are linked from
  # https://www.canterbury.ac.nz/about-uc/corporate-information/regulations/uc-calendar
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/content/dam/uoc-main-site/documents/pdfs/a-regulations/uc-calendar/UC-Calendar-2024.pdf
    parser: pdf
    manual: true
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/content/dam/uoc-main-site/documents/pdfs/a-regulations/uc-calendar/UC-Calendar-2025.pdf
    parser: pdf
    manual: true
  # Student Services Levy; the page now states 2026 ($1,236.00) and 2027 ($1,285.40) side by side.
  # The records keep the 2026 rate by convention, so the pattern is anchored on the first (2026)
  # figure, written with cents.
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/student-services-levy
    parser: html
    targets:
    - key: annualCompulsoryFees
      pattern: For one year of study \(120 points\), this equates to \$([\d,]+)(?:\.\d\d)? in 2026
  - university: canterbury
    country: nz
    url: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/living-costs/living-costs-estimate-flatting
    parser: html
    targets:
    - key: living.housing
      pattern: Shared rental accommodation - \$([\d,]+) .*?Power - \$([\d,]+) .*?Internet - \$([\d,]+)
      multiplier: 4.333333333333333
    - key: living.food
      pattern: Food - \$([\d,]+)
      multiplier: 4.333333333333333
    - key: living.transport
      pattern: Transport - \$([\d,]+)
      multiplier: 4.333333333333333
    - key: living.personal
      pattern: Mobile phone - \$([\d,]+) .*?Contents and Liability Insurance - \$([\d,]+) .*?Other - \$([\d,]+)
      multiplier: 4.333333333333333
