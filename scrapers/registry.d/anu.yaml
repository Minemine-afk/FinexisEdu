# The Australian National University. Each programme page on programsandcourses.anu.edu.au
# states the "Annual indicative fee for international students" (per 48 units) for the year
# in the URL; the Services and Amenities Fee source is in ../registry.yaml.
sources:
  - university: anu
    country: au
    url: https://programsandcourses.anu.edu.au/2026/program/BARTS
    parser: html
    targets:
    - level: bachelor
      field: arts
      pattern: Annual indicative fee for international students \$ ?([\d,]+(?:\.\d{2})?)
