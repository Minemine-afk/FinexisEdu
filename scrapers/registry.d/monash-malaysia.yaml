# Monash University Malaysia. monash.edu.my returns HTTP 403 to automated access, so fees are
# read from StudyMalaysia.com course pages (secondary), which quote Malaysian / international fees.
sources:
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0001536
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: bachelor
      field: engineering
      pattern: 'Fees: RM[\d,]+ per year / RM([\d,]+) per year \(international\)'
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0001508
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: bachelor
      field: computing
      pattern: 'Fees: RM[\d,]+ per year / RM([\d,]+) per year \(international\)'
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0054344
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: bachelor
      field: business
      pattern: 'Fees: RM[\d,]+ per year / RM([\d,]+) per year \(international\)'
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0053621
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: bachelor
      field: sciences
      pattern: 'Fees: RM[\d,]+ per year / RM([\d,]+) per year \(international\)'
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0054347
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: bachelor
      field: arts
      pattern: 'Fees: RM[\d,]+ per year / RM([\d,]+) per year \(international\)'
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0001560
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: master
      field: engineering
      pattern: 'Fees: RM[\d,]+/Year / RM([\d,]+)/Year \(international\)'
  # whole-course fee, 2-year programme
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0054366
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: master
      field: computing
      pattern: 'Fees: RM[\d,]+/course / RM([\d,]+)/course \(international\)'
      multiplier: 0.5
  # whole-course fee, 1.5-year programme
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0000891
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: master
      field: business
      pattern: 'Fees: RM[\d,]+/course / RM([\d,]+)/course \(international\)'
      multiplier: 0.6666666667
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0001559
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: master
      field: sciences
      pattern: 'Fees: RM[\d,]+/Year / RM([\d,]+)/Year \(international\)'
  # whole-course fee, 1.5-year programme
  - university: monash-malaysia
    country: my
    url: https://studymalaysia.com/what/course/monash/0053622
    parser: html
    year_pattern: 'Monash University Malaysia: (\d{4}) Fees'
    targets:
    - level: master
      field: arts
      pattern: 'Fees: RM[\d,]+/course / RM([\d,]+)/course \(international\)'
      multiplier: 0.6666666667
  # secondary Malaysia-wide student budget (ranges; midpoints taken); Monash's own page blocks bots
  - university: monash-malaysia
    country: my
    url: https://westaycoliving.com/blog/cost-of-living-malaysia-international-students-2026
    parser: html
    targets:
    - key: living.housing
      pattern: 'student accommodation in Malaysia may cost from around RM([\d,]+) to RM([\d,]+)\+ per month.*?Electricity and water: RM([\d,]+) to RM([\d,]+).*?Internet or WiFi: included, shared, or RM([\d,]+) to RM([\d,]+)'
      multiplier: 0.5
    - key: living.food
      pattern: 'Comfortable lifestyle: RM([\d,]+) to RM([\d,]+) per month'
      multiplier: 0.5
    - key: living.transport
      pattern: walks or uses public transport may spend around RM([\d,]+) to RM([\d,]+) per month
      multiplier: 0.5
    - key: living.personal
      pattern: 'Mobile plan: RM([\d,]+) to RM([\d,]+).*?A practical monthly estimate is around RM([\d,]+) to RM([\d,]+)'
      multiplier: 0.5
