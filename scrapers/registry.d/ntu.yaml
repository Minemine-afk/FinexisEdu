# Nanyang Technological University: sources added after the core registry.yaml entries.
#
# School of Civil and Environmental Engineering MSc (Civil Engineering). Self-financed from the
# AY2025 intake; one fee for all nationalities. The page lists one block per intake year
# ('Tuition fee for AY2026-2027 (based on minimum candidature) S$57,232 Tuition fee per semester
# S$28,616 S$14,308'); only the newest block is followed by 'Important things to note', which the
# pattern anchors on. year_pattern takes the largest year on the page.
# The 2024-intake (MOE-subsidised) history rows come from the NTU Graduate Admissions AY2026-2027
# coursework fee PDF, table B1.3a, which registry.yaml already scrapes for the RSIS M.Sc.
sources:
  - university: ntu
    country: sg
    url: https://www.ntu.edu.sg/cee/admissions/programmes/graduate-programmes/detail/master-of-science-in-civil-engineering
    parser: html
    year_pattern: Tuition fee for AY(\d{4})-\d{4}
    targets:
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: citizen
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: pr
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: international
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
  # Master of Science in Psychology (MScP): psychology programme added Oct 2026; fee read by hand
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/sss/graduate-education/MScP/tuition-fees"
    manual: true

  # National Institute of Education (NIE), NTU's teacher-training institute, added 2026-10-15 as
  # partner 'nie'. Fees read by hand from NIE's handbook and fee PDFs (nie.edu.sg now redirects to
  # ntu.edu.sg/nie); the PDFs are per academic year and replaced each year, so manual.
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/admissions/undergraduate/fees-and-funding/tuition-fees"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/graduate-fees-ay2026-2027/moe-cw-sub-ay2026---newintakes.pdf?sfvrsn=2a403fb3_1"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/graduate-fees-ay2026-2027/research-fees-ay2026_new-intakes.pdf?sfvrsn=fa819c4a_1"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/graduate-fees-ay2026-2027/self-fin-mbc-ay2026---newintakes_updated.pdf?sfvrsn=1cc1e7c7_1"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/ote-documents/programme/general-information.pdf?sfvrsn=30825969_18"
    manual: true
