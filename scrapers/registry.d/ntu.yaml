    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: ntu
    country: sg
    url: https://www.ntu.edu.sg/admissions/undergraduate/fees-and-funding/tuition-fees
    parser: html
    targets:
    - level: bachelor
      field: psychology
      programme: Bachelor of Social Sciences in Psychology (Hons)
      tier: citizen
      pattern: 2026.{0,516}?those listed below\) \$ ([\d,.\' ]*\d)
    - level: bachelor
