# Nanyang Technological University: sources added after the core registry.yaml entries.
#
# School of Civil and Environmental Engineering MSc (Civil Engineering). Self-financed from the
# AY2025 intake; one fee for all nationalities. The page lists one block per intake year
# ('Tuition fee for AY2026-2027 (based on minimum candidature) S$57,232 Tuition fee per semester
# S$28,616 S$14,308'); only the newest block is followed by 'Important things to note', which the
# pattern anchors on. year_pattern takes the largest year on the page.
# The 2024-intake (MOE-subsidised) history rows come from the NTU Graduate Admissions AY2026-2027
# coursework fee PDF, table B1.3a, which registry.yaml already scrapes for the RSIS M.Sc.
sources:
  - university: ntu
    country: sg
    url: https://www.ntu.edu.sg/engineering/coe-programmes/graduate/coe-programme-detail/master-of-science-in-civil-engineering
    parser: html
    year_pattern: Tuition fee for AY(\d{4})-\d{4}
    targets:
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: citizen
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: pr
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
    - level: master
      field: engineering
      programme: Civil Engineering
      tier: international
      pattern: \(based on minimum candidature\) S\$([\d,.]+) Tuition fee per semester S\$[\d,.]+ S\$[\d,.]+ Important things to note
  # Master of Science in Psychology (MScP): psychology programme added Oct 2026; fee read by hand
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/sss/graduate-education/MScP/tuition-fees"
    manual: true

  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/graduate-fees-ay2026-2027/research-fees-ay2026_new-intakes.pdf?sfvrsn=fa819c4a_1"
    manual: true
  # NIE earlier-year fees (AY2024-25, AY2025-26) added 2026-10-15; PDFs read by hand
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/admissions/undergraduate/fees-and-funding/tuition-fees/accepted-programme-offer-in-2024"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/admissions/undergraduate/fees-and-funding/tuition-fees/accepted-programme-offer-in-2025"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/ay2024-2025-fees/new-intake/moe_cw-ay2024---newintakesv2.pdf?sfvrsn=64fc2f55_3"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/ay2024-2025-fees/new-intake/research-fees-ay2024_new-intakesv2.pdf?sfvrsn=b6e29718_3"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/ay2024-2025-fees/new-intake/self-fin-mbc-ay2024---newintakes_may2024.pdf?sfvrsn=27c8a370_3"
    manual: true
  - university: ntu
    country: sg
    url: "https://www.ntu.edu.sg/media/docs/nielibraries/gpl-documents/graduate-tuition-fees/graduate-tuition-fees-ay2025-2026/11-july-2025/moe-cw-sub-ay2025---newintakes-v2_final.pdf?sfvrsn=1e366e8_1"
