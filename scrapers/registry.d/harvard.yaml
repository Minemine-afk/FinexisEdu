sources:
  # Harvard College cost of attendance: tuition, fees and the living-cost budget (latest year listed first)
  - university: harvard
    country: us
    url: https://college.harvard.edu/financial-aid/how-aid-works/cost-attendance
    parser: html
    year_pattern: (\d{4})-\d{4} Cost of Attendance
    targets:
    - level: bachelor
      pattern: Cost of Attendance Tuition \$([\d,]+) Fees
    - level: bachelor
      key: annualCompulsoryFees
      pattern: Cost of Attendance Tuition \$[\d,]+ Fees \$([\d,]+) Housing
    - key: living.housing
      pattern: Cost of Attendance Tuition \$[\d,]+ Fees \$[\d,]+ Housing \$([\d,]+) Food
      multiplier: 0.1111111111111111
    - key: living.food
      pattern: Cost of Attendance Tuition \$[\d,]+ Fees \$[\d,]+ Housing \$[\d,]+ Food \$([\d,]+)
      multiplier: 0.1111111111111111
    - key: living.personal
      pattern: Estimated personal expenses \$([\d,]+) Estimated books \$([\d,]+)
      multiplier: 0.1111111111111111
  # Harvard Griffin GSAS cost of attendance: SEAS master's tuition and health/council fees
  - university: harvard
    country: us
    url: https://gsas.harvard.edu/apply/cost-attendance-2026-2027
    parser: html
    year_pattern: Tuition Fee (\d{4})[–-]\d{4}
    targets:
    - level: master
      field: engineering
      pattern: Computational Science and Engineering master of science \(SM\) \$([\d,]+)
    - level: master
      field: computing
      pattern: Data Science master of science \(SM\) \$([\d,]+) \(first year\); \$([\d,]+) \(second year
      multiplier: 0.6666666666666666
    - level: master
      field: engineering
      key: annualCompulsoryFees
      pattern: HUSHP Student Health Fee \(SHF\)[^$]*\$(?=([\d,]+))([\d,]+)/Term.*?charged a \$([\d,]+) Harvard Griffin GSAS Student Council fee
    - level: master
      field: computing
      key: annualCompulsoryFees
      pattern: HUSHP Student Health Fee \(SHF\)[^$]*\$(?=([\d,]+))([\d,]+)/Term.*?charged a \$([\d,]+) Harvard Griffin GSAS Student Council fee
  # Harvard Business School MBA cost of attendance
  - university: harvard
    country: us
    url: https://www.hbs.edu/mba/financial-aid/tuition-assistance/cost-of-attendance
    parser: html
    year_pattern: MBA Program (\d{4})-\d{2}
    targets:
    - level: master
      field: business
      pattern: MBA Program \d{4}-\d{2} 9-Month Total Cost Single Tuition \$([\d,]+)
    - level: master
      field: business
      key: annualCompulsoryFees
      pattern: MBA Program \d{4}-\d{2} 9-Month Total Cost Single Tuition \$[\d,]+ HUHS Student Health Fee \(SHF\) \$([\d,]+)
  # Harvard Kennedy School MPP tuition and fees
  - university: harvard
    country: us
    url: https://www.hks.harvard.edu/admissions-aid/funding-your-education/funding-your-masters-education/tuition-fees
    parser: html
    year_pattern: (\d{4})-\d{4} Tuition and Fees by Program
    targets:
    - level: master
      field: arts
      pattern: Master in Public Policy Expense Cost Tuition \$([\d,]+)
    - level: master
      field: arts
      key: annualCompulsoryFees
      pattern: Master in Public Policy Expense Cost Tuition \$[\d,]+ Course materials fee \$([\d,]+) HKS student activity fee \$([\d,]+) HUHS Student Health Fee \(SHF\)\*? \$([\d,]+)
  # Harvard Law School JD cost of attendance (standard 9-month student budget, latest year first)
  - university: harvard
    country: us
    url: https://hls.harvard.edu/sfs/financial-aid/financial-aid-policy/cost-of-attendance/
    parser: html
    year_pattern: (\d{4})-\d{2} Standard Student Budget
    targets:
    - level: master
      field: law
      pattern: Standard Student Budget \(9-Month\) Tuition \$([\d,]+) Mandatory HUHS Student Health Fee
    - level: master
      field: law
      key: annualCompulsoryFees
      pattern: Standard Student Budget \(9-Month\) Tuition \$[\d,]+ Mandatory HUHS Student Health Fee \$([\d,]+)
  # Harvard T.H. Chan School of Public Health tuition, fees and cost of attendance: Master of Science
  # table, 80-credit two-year full-time column (fourth amount in the Tuition / Student Health Fee rows)
  - university: harvard
    country: us
    url: https://hsph.harvard.edu/tuition-and-financial-aid/tuition-fees-and-annual-cost-of-attendance/
    parser: html
    year_pattern: (\d{4}) [–-] \d{4} Academic Year
    targets:
    - level: master
      field: sciences
      pattern: Master of Science 80-credit 2 years-full-time \d Direct \(Billed\) Costs \(per year\) Tuition \d \$[\d,]+ per year \$[\d,]+ per year \$[\d,]+ per year \$([\d,]+) per year
    - level: master
      field: sciences
      key: annualCompulsoryFees
      pattern: Master of Science 80-credit 2 years-full-time .*?Student Health Fee \$[\d,]+ per year \$[\d,]+ per year \$ [–-] \$([\d,]+) per year
  # Harvard Medical School MD cost of attendance: site returns 403 to automated requests, so checked by hand
  - university: harvard
    country: us
    url: https://hms.harvard.edu/education-admissions/md-program/cost-aid/cost-attendance
    parser: html
    manual: true
