# Eastern Institute of Technology (added Oct 2026).
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: eit
    country: nz
    url: https://www.immigration.govt.nz/process-to-apply/applying-for-a-visa/providing-evidence-and-documents-to-support-your-visa-application/student-fund-requirements/
    parser: html
    manual: true
  # Scraped from 2026-11 (was read by hand). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: eit
    country: nz
    url: https://www.eit.ac.nz/wp-content/uploads/programme-app-packs/int%20Programme%20Matrix.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: business
      programme: Bachelor of Accounting
      tier: international
      pattern: 2027.{0,397}?of Accounting Napier \$([\d,.\' ]*\d)
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: eit
    country: nz
    url: https://www.eit.ac.nz/wp-content/uploads/programme-app-packs/int%20Programme%20Matrix.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: computing
      programme: Bachelor of Computing Systems
      tier: international
      pattern: 2027 Programme Dates and Fees.{0,20000}?Bachelor\ of\ Computing\ Systems Napier \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: business
      programme: Bachelor of Business Studies
      tier: international
      pattern: 2027 Programme Dates and Fees.{0,20000}?Bachelor\ of\ Business\ Studies Napier \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: sciences
      programme: Bachelor of Viticulture and Wine Science
      tier: international
      pattern: 2027 Programme Dates and Fees.{0,20000}?Bachelor\ of\ Viticulture\ and\ Wine\ Science Napier \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: arts
      programme: Bachelor of Creative Practice
      tier: international
      pattern: 2027 Programme Dates and Fees.{0,20000}?Bachelor\ of\ Creative\ Practice Napier \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: bachelor
      field: nursing
      programme: Bachelor of Nursing
      tier: international
      pattern: 2027 Programme Dates and Fees.{0,20000}?Bachelor\ of\ Nursing Napier \$(\d{1,3}(?:,\d{3})+)(?![\d,])
    - level: master
      field: computing
      programme: Master of Information Technology
      tier: international
      pattern: '2027 Programme Dates and Fees.{0,20000}?Master\ of\ Information\ Technology \(180 credits\) Napier(?: & Auckland)? \$(\d{1,3}(?:,\d{3})+)(?![\d,])'
      multiplier: 0.6666666666666666
    - level: master
      field: business
      programme: Master of Applied Management
      tier: international
      pattern: '2027 Programme Dates and Fees.{0,20000}?Master\ of\ Applied\ Management \(180 credits\) Napier(?: & Auckland)? \$(\d{1,3}(?:,\d{3})+)(?![\d,])'
      multiplier: 0.6666666666666666
    - level: master
      field: arts
      programme: Master of Professional Creative Practice
      tier: international
      pattern: '2027 Programme Dates and Fees.{0,20000}?Master\ of\ Professional\ Creative\ Practice \(180 credits\) Napier(?: & Auckland)? \$(\d{1,3}(?:,\d{3})+)(?![\d,])'
      multiplier: 0.6666666666666666
    - level: master
      field: nursing
      programme: Master of Nursing Science
      tier: international
      pattern: '2027 Programme Dates and Fees.{0,20000}?Master\ of\ Nursing\ Science \(180 credits\) Napier(?: & Auckland)? \$(\d{1,3}(?:,\d{3})+)(?![\d,])'
      multiplier: 0.6666666666666666
