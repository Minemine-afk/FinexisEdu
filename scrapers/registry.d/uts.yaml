# University of Technology Sydney. Added Oct 2026; 2027 international fees read by hand from the
# per-session course summary tables (PDF), annual = per-session fee x 2.
sources:
  # living-cost estimate (checked by hand; see livingCosts.notes in the data file)
  - university: uts
    country: au
    url: https://www.uts.edu.au/for-students/international/life-in-sydney/cost-of-living
    parser: html
    manual: true
  # Scraped from 2026-11 (was worked out by hand from this page; the multiplier repeats that sum). The pattern keeps the fee year literal, so when the page
  # moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
  - university: uts
    country: au
    url: https://www.uts.edu.au/for-students/international/guides-for-international-students/contentassets/utsi-listing-grid-international-undergraduate-course-summary-table.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: business
      programme: Bachelor of Business
      tier: international
      pattern: 2027.{0,756}?Bachelor of Business 6 \$([\d,.\' ]*\d)
      multiplier: 2
    - level: bachelor
      field: arts
      programme: Bachelor of Communication (Digital and Social Media)
      tier: international
      pattern: 2027.{0,1153}?and Social Media 6 \$([\d,.\' ]*\d)
      multiplier: 2
  # Scraped from 2026-11 (was read by hand from this page's fee table; any multiplier repeats the hand sum). The pattern keeps the fee year literal,
  # so when the page moves to a new year it stops matching and is listed for a manual check instead of mislabelling the fee.
