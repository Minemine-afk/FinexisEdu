    country: au
    url: https://www.uts.edu.au/for-students/international/guides-for-international-students/contentassets/utsi-listing-grid-international-undergraduate-course-summary-table.pdf
    parser: pdf
    targets:
    - level: bachelor
      field: engineering
      programme: Bachelor of Engineering (Honours)
      tier: international
      pattern: 2027 (?:International )?(?:Undergraduate|Postgraduate) Course Summary Table.{0,60000}?C09066 \d{6}[A-Z] [^$]{0,120}? \d{1,2} \$(\d{1,3}(?:,\d{3})+)(?![\d,])
      multiplier: 2
    - level: bachelor
      field: computing
